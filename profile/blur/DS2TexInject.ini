; Sahin: the texture plugin (third_party/ds2texinject) for Blur's PlayStation button prompts.
[DS2TexInject]
Enabled=1
; Our atlas, 0xF6FA7B91.dds (art/make-prompts.py), in the game folder.
TextureDir=texmod\_cache
; No key turns it off: the console has no F10.
ToggleKey=0
Pool=managed
LoadBudget=4
LogHashes=0
DumpTextures=0
